<html>
<head>
    <title>API Testing</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0;
            padding: 25px;
            background: #e8f5e9;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: white;
            padding: 35px;
            border: 3px solid #4caf50;
        }
        h1 { 
            color: #2e7d32;
            margin: 0 0 5px 0;
            font-size: 26px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 25px;
            font-size: 13px;
        }
        .section {
            margin-bottom: 20px;
            padding: 18px;
            background: #f1f8f4;
            border-left: 5px solid #66bb6a;
        }
        h3 { 
            color: #333;
            margin: 0 0 12px 0;
            font-size: 16px;
            font-weight: bold;
        }
        button { 
            padding: 9px 14px;
            margin: 4px;
            border: 2px solid #4caf50;
            background: white;
            color: #4caf50;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        button:hover { 
            background: #4caf50;
            color: white;
        }
        #output { 
            background: #1a1a1a;
            color: #00ff00;
            padding: 18px;
            margin-top: 20px;
            font-family: Consolas, monospace;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 380px;
            overflow-y: auto;
            border: 2px solid #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>API Testing Page</h1>
        <div class="subtitle">Test all REST endpoints</div>
        
        <div class="section">
            <h3>Library Books</h3>
            <button onclick="call('/api/books')">All Books</button>
            <button onclick="call('/api/books/1')">Book 1</button>
            <button onclick="call('/api/books/search?title=clean')">Search</button>
        </div>

        <div class="section">
            <h3>Students</h3>
            <button onclick="call('/api/students')">All Students</button>
            <button onclick="call('/api/students/1')">Student 1</button>
            <button onclick="call('/api/students/major/Computer Science')">CS Major</button>
            <button onclick="call('/api/students/filter?gpa=3.5')">GPA 3.5+</button>
        </div>

        <div class="section">
            <h3>Restaurant Menu</h3>
            <button onclick="call('/api/menu')">All Items</button>
            <button onclick="call('/api/menu/1')">Item 1</button>
            <button onclick="call('/api/menu/category/Appetizer')">Appetizers</button>
            <button onclick="call('/api/menu/available?available=true')">Available</button>
        </div>

        <div class="section">
            <h3>Products</h3>
            <button onclick="call('/api/products')">All Products</button>
            <button onclick="call('/api/products/1')">Product 1</button>
            <button onclick="call('/api/products/category/Electronics')">Electronics</button>
            <button onclick="call('/api/products/brand/Dell')">Dell</button>
            <button onclick="call('/api/products/search?keyword=laptop')">Search</button>
            <button onclick="call('/api/products/in-stock')">In Stock</button>
        </div>

        <div class="section">
            <h3>Tasks</h3>
            <button onclick="call('/api/tasks')">All Tasks</button>
            <button onclick="call('/api/tasks/1')">Task 1</button>
            <button onclick="call('/api/tasks/status?completed=false')">Incomplete</button>
            <button onclick="call('/api/tasks/priority/HIGH')">High Priority</button>
        </div>

        <div class="section">
            <h3>User Profiles (Bonus)</h3>
            <button onclick="call('/api/users')">All Users</button>
            <button onclick="call('/api/users/1')">User 1</button>
            <button onclick="call('/api/users/username/john_doe')">By Username</button>
            <button onclick="call('/api/users/country/USA')">By Country</button>
            <button onclick="call('/api/users/age-range?min=20&max=30')">Age 20-30</button>
        </div>

        <pre id="output">Click a button to test...</pre>
    </div>

    <script>
        function call(url) {
            document.getElementById('output').textContent = 'Loading...';
            fetch('http://localhost:8082' + url)
                .then(r => r.json())
                .then(d => document.getElementById('output').textContent = JSON.stringify(d, null, 2))
                .catch(e => document.getElementById('output').textContent = 'Error connecting to server. Make sure Spring Boot is running on port 8082.');
        }
    </script>
</body>
</html>
